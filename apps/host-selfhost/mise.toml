# Runtime toolchain for trusted local stdio MCPs in the private self-host image.
# The Executor process itself uses the same Bun version pinned by package.json;
# the other tools are available to MCP commands through mise shims.

[tools]
node = "24.18.0"
bun = "1.3.11"
python = "3.13.14"
rust = "1.97.1"
uv = "0.11.32"
